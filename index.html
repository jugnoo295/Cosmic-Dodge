<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Dodge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
  canvas { border: 1px solid #1a3a5c; box-shadow: 0 0 30px #0af2; display: block; }
  #shoot-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(0,170,255,0.18); border: 2px solid #0af;
    color: #0af; font-size: 28px; display: none;
    align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; cursor: pointer;
    box-shadow: 0 0 16px #0af4;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="shoot-btn">🔥</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width = 480, H = C.height = 640;
const shootBtn = document.getElementById('shoot-btn');

// Detect touch device
const isTouch = ('ontouchstart' in window);
if (isTouch) shootBtn.style.display = 'flex';

// Audio
const AC = new (window.AudioContext || window.webkitAudioContext)();
function resumeAC() { if (AC.state === 'suspended') AC.resume(); }

function playShoot() {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = 'square';
  o.frequency.setValueAtTime(880, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(220, AC.currentTime + 0.08);
  g.gain.setValueAtTime(0.15, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.09);
  o.start(); o.stop(AC.currentTime + 0.09);
}
function playHit() {
  const buf = AC.createBuffer(1, AC.sampleRate * 0.12, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 400; f.Q.value = 0.8;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.5, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.12);
  src.start(); src.stop(AC.currentTime + 0.12);
}
function playExplode() {
  const buf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
  const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 200;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0.7, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
  src.start(); src.stop(AC.currentTime + 0.3);
}
function playPowerup() {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(440, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(880, AC.currentTime + 0.15);
  g.gain.setValueAtTime(0.2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.2);
  o.start(); o.stop(AC.currentTime + 0.2);
}

// Persistent high score
let hiScore = parseInt(localStorage.getItem('cosmicHiScore') || '0');

// State
let state = 'menu'; // menu | play | pause | dead
let score, mult, wave, frameN;
let ship, bullets, asteroids, particles, powerupItems, activePU;
let keys = {};
let touchFiring = false;

function initEntities() {
  ship = { x: W/2, y: H-80, w: 22, h: 28, speed: 4, shootCd: 0, invincible: 0 };
  bullets = []; asteroids = []; particles = []; powerupItems = [];
  activePU = { shield: 0, rapid: 0, slow: 0 };
}
initEntities();

function startGame() {
  state = 'play';
  score = 0; mult = 1; wave = 1; frameN = 0;
  initEntities();
}

// Input
document.addEventListener('keydown', e => {
  resumeAC();
  if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
  keys[e.key] = true;
  if (state === 'menu' || state === 'dead') startGame();
});
document.addEventListener('keyup', e => keys[e.key] = false);
C.addEventListener('click', () => { resumeAC(); if (state === 'menu' || state === 'dead') startGame(); });

// Touch move
let touchX = null;
C.addEventListener('touchstart', e => {
  e.preventDefault(); resumeAC();
  if (state === 'menu' || state === 'dead') { startGame(); return; }
  if (state === 'pause') { togglePause(); return; }
  touchX = e.touches[0].clientX;
});
C.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length) touchX = e.touches[0].clientX; });
C.addEventListener('touchend', e => { e.preventDefault(); touchX = null; });

// Shoot button
shootBtn.addEventListener('touchstart', e => { e.preventDefault(); resumeAC(); touchFiring = true; });
shootBtn.addEventListener('touchend', e => { e.preventDefault(); touchFiring = false; });
shootBtn.addEventListener('mousedown', () => touchFiring = true);
shootBtn.addEventListener('mouseup', () => touchFiring = false);

function togglePause() {
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}

// Stars
let stars = Array.from({length:80}, ()=>({ x:Math.random()*W, y:Math.random()*H, s:Math.random()*2, b:Math.random() }));

function burst(x, y, color, n=10) {
  for (let i=0;i<n;i++) {
    let a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,color});
  }
}

function spawnAsteroid() {
  let size = 18+Math.random()*20+wave*1.5;
  let speed = (0.8+Math.random()*1.2+wave*0.15)*(activePU.slow>0?0.45:1);
  asteroids.push({x:size+Math.random()*(W-size*2),y:-size,r:size,speed,rot:0,rotS:(Math.random()-0.5)*0.08,hp:size>30?2:1});
}

function spawnPowerup(x, y) {
  if (Math.random()>0.28) return;
  const types=['shield','rapid','slow'];
  const colors={shield:'#0f8',rapid:'#f80',slow:'#88f'};
  const icons={shield:'🛡',rapid:'⚡',slow:'❄'};
  let t=types[Math.floor(Math.random()*3)];
  powerupItems.push({x,y,type:t,color:colors[t],icon:icons[t],vy:1.2,life:300});
}

function drawShip(x, y, alpha=1) {
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);
  ctx.fillStyle='#4af';
  ctx.beginPath(); ctx.moveTo(0,-ship.h/2); ctx.lineTo(ship.w/2,ship.h/2); ctx.lineTo(-ship.w/2,ship.h/2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0ff'; ctx.beginPath(); ctx.ellipse(0,-4,5,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsl(${30+Math.random()*30},100%,60%)`;
  ctx.beginPath(); ctx.ellipse(0,ship.h/2+3,5,4+Math.random()*4,0,0,Math.PI*2); ctx.fill();
  if (activePU.shield>0) {
    ctx.strokeStyle=`rgba(0,255,180,${0.4+0.3*Math.sin(frameN*0.2)})`;
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
  ctx.strokeStyle='#aaa'; ctx.fillStyle='#444'; ctx.lineWidth=2;
  ctx.beginPath();
  for (let i=0;i<8;i++) {
    let ang=(i/8)*Math.PI*2, rr=a.r*(0.75+0.25*Math.sin(i*3.7));
    i===0?ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr):ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function update() {
  if (state !== 'play') return;
  frameN++;

  let spd = ship.speed*(activePU.rapid>0?1.4:1);
  if ((keys['ArrowLeft']||keys['a'])&&ship.x>ship.w/2) ship.x-=spd;
  if ((keys['ArrowRight']||keys['d'])&&ship.x<W-ship.w/2) ship.x+=spd;
  if ((keys['ArrowUp']||keys['w'])&&ship.y>ship.h/2) ship.y-=spd;
  if ((keys['ArrowDown']||keys['s'])&&ship.y<H-ship.h/2) ship.y+=spd;
  if (touchX!==null) ship.x+=(touchX-C.getBoundingClientRect().left-ship.x)*0.15;

  ship.shootCd--;
  let shootRate = activePU.rapid>0?8:18;
  if ((keys[' ']||keys['ArrowUp']||touchFiring) && ship.shootCd<=0) {
    ship.shootCd=shootRate; playShoot();
    bullets.push({x:ship.x,y:ship.y-ship.h/2,vy:-9});
    if (activePU.rapid>0) {
      bullets.push({x:ship.x-8,y:ship.y-ship.h/2+5,vy:-9});
      bullets.push({x:ship.x+8,y:ship.y-ship.h/2+5,vy:-9});
    }
  }

  bullets.forEach(b=>b.y+=b.vy);
  bullets=bullets.filter(b=>b.y>-10);

  let spawnRate=Math.max(20,80-wave*5);
  if (frameN%spawnRate===0) spawnAsteroid();
  if (frameN%600===0) { wave++; mult=Math.min(mult+0.5,5); }

  let slowF=activePU.slow>0?0.45:1;
  asteroids.forEach(a=>{a.y+=a.speed*slowF;a.rot+=a.rotS;});
  asteroids=asteroids.filter(a=>a.y<H+a.r);

  powerupItems.forEach(p=>{p.y+=p.vy;p.life--;});
  powerupItems=powerupItems.filter(p=>p.life>0&&p.y<H+20);

  if (activePU.shield>0) activePU.shield--;
  if (activePU.rapid>0) activePU.rapid--;
  if (activePU.slow>0) activePU.slow--;
  if (ship.invincible>0) ship.invincible--;

  bullets.forEach(b=>{
    asteroids.forEach(a=>{
      let dx=b.x-a.x,dy=b.y-a.y;
      if (dx*dx+dy*dy<a.r*a.r) {
        b.dead=true; a.hp--;
        burst(a.x,a.y,'#f84',6);
        if (a.hp<=0) { playExplode(); burst(a.x,a.y,'#fa0',15); score+=Math.floor(10*mult); spawnPowerup(a.x,a.y); a.dead=true; }
        else playHit();
      }
    });
  });
  bullets=bullets.filter(b=>!b.dead);
  asteroids=asteroids.filter(a=>!a.dead);

  if (ship.invincible<=0) {
    asteroids.forEach(a=>{
      let dx=ship.x-a.x,dy=ship.y-a.y;
      if (dx*dx+dy*dy<(a.r+14)*(a.r+14)) {
        if (activePU.shield>0) { activePU.shield=0; a.dead=true; burst(ship.x,ship.y,'#0f8',20); }
        else { playExplode(); burst(ship.x,ship.y,'#f00',30); if(score>hiScore){hiScore=score;localStorage.setItem('cosmicHiScore',hiScore);} state='dead'; }
      }
    });
    asteroids=asteroids.filter(a=>!a.dead);
  }

  powerupItems.forEach(p=>{
    let dx=ship.x-p.x,dy=ship.y-p.y;
    if (dx*dx+dy*dy<34*34) { playPowerup(); activePU[p.type]=300; burst(p.x,p.y,p.color,12); p.life=0; }
  });

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--;});
  particles=particles.filter(p=>p.life>0);
  stars.forEach(s=>{s.y+=0.4+s.s*0.3;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
}

// ── Draw helpers ──
function drawBg() {
  let bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#000510'); bg.addColorStop(1,'#020818');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    ctx.globalAlpha=0.3+s.b*0.7; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.s*0.7,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawOverlay(title, titleColor, lines, hint) {
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=titleColor; ctx.font='bold 36px Courier New';
  ctx.shadowColor=titleColor; ctx.shadowBlur=22;
  ctx.fillText(title, W/2, H/2-70);
  ctx.shadowBlur=0;
  lines.forEach((l,i)=>{ ctx.fillStyle=l.c||'#fff'; ctx.font=l.f||'18px Courier New'; ctx.fillText(l.t, W/2, H/2-20+i*34); });
  ctx.fillStyle='#0f8'; ctx.font='15px Courier New';
  ctx.fillText(hint, W/2, H/2+140);
}

function drawHUD() {
  ctx.textAlign='left'; ctx.font='14px Courier New';
  ctx.fillStyle='#0af'; ctx.fillText(`SCORE  ${score}`,12,24);
  ctx.fillStyle='#888'; ctx.fillText(`BEST   ${hiScore}`,12,44);
  ctx.fillStyle='#0af'; ctx.fillText(`WAVE   ${wave}`,12,64);
  ctx.fillStyle='#fa0'; ctx.fillText(`MULT   x${mult.toFixed(1)}`,12,84);

  // Pause hint
  ctx.fillStyle='#334'; ctx.font='11px Courier New'; ctx.textAlign='right';
  ctx.fillText('[P] Pause', W-10, 20);

  // Active powerups
  let py=20;
  const puC={shield:'#0f8',rapid:'#f80',slow:'#88f'};
  const puI={shield:'🛡',rapid:'⚡',slow:'❄'};
  ['shield','rapid','slow'].forEach(t=>{
    if(activePU[t]>0){
      ctx.font='18px serif'; ctx.textAlign='right'; ctx.fillText(puI[t],W-14,py);
      ctx.fillStyle=puC[t]; ctx.font='11px Courier New'; ctx.fillText(`${Math.ceil(activePU[t]/60)}s`,W-14,py+14);
      py+=36;
    }
  });
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawBg();

  if (state==='menu') {
    ctx.fillStyle='#0af'; ctx.font='bold 38px Courier New'; ctx.textAlign='center';
    ctx.shadowColor='#0af'; ctx.shadowBlur=20;
    ctx.fillText('COSMIC DODGE',W/2,H/2-80);
    ctx.shadowBlur=0;
    ctx.fillStyle='#aaa'; ctx.font='14px Courier New';
    ctx.fillText('Move: Arrow Keys / WASD',W/2,H/2-20);
    ctx.fillText('Shoot: Space / Up Arrow',W/2,H/2+8);
    ctx.fillText('Pause: P',W/2,H/2+34);
    if (hiScore>0) { ctx.fillStyle='#fa0'; ctx.font='16px Courier New'; ctx.fillText(`Best: ${hiScore}`,W/2,H/2+70); }
    ctx.fillStyle='#0f8'; ctx.font='17px Courier New';
    ctx.fillText('[ TAP or PRESS ANY KEY ]',W/2,H/2+110);
    drawShip(W/2,H/2+170,1);
    return;
  }

  // Game world
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/50; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  bullets.forEach(b=>{
    ctx.fillStyle=activePU.rapid>0?'#fa0':'#0ff';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
    ctx.fillRect(b.x-2,b.y-8,4,12); ctx.shadowBlur=0;
  });
  asteroids.forEach(drawAsteroid);
  powerupItems.forEach(p=>{
    ctx.globalAlpha=Math.min(1,p.life/30);
    ctx.font='20px serif'; ctx.textAlign='center'; ctx.fillText(p.icon,p.x,p.y);
    ctx.globalAlpha=1;
  });

  let alpha=ship.invincible>0?(Math.floor(frameN/4)%2?0.3:1):1;
  drawShip(ship.x,ship.y,alpha);
  drawHUD();

  if (state==='pause') {
    drawOverlay('PAUSED','#0af',[
      {t:`Score: ${score}`, c:'#fff'},
      {t:`Wave:  ${wave}`,  c:'#0af'},
      {t:`Best:  ${hiScore}`,c:'#fa0'},
    ], isTouch ? '[ TAP to Resume ]' : '[ P or any key to Resume ]');
  }

  if (state==='dead') {
    const newBest = score>=hiScore && score>0;
    drawOverlay('GAME OVER','#f44',[
      {t: newBest ? '🏆 NEW BEST! 🏆' : `Score: ${score}`, c: newBest?'#fa0':'#fff', f:'20px Courier New'},
      {t: newBest ? `${score} pts` : `Best: ${hiScore}`, c:'#fa0'},
      {t:`Wave reached: ${wave}`, c:'#88f'},
    ], isTouch ? '[ TAP to Retry ]' : '[ Press any key to Retry ]');
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
